# Upstream sources this project studies. `tools/fetch_refs.py` clones or mirrors
# every entry into refs/ (gitignored) and records the resolved commits in
# refs.lock.json. Nothing in refs/ is ours: it is never committed, built or run
# without a source review first (see AGENTS.md).
#
# Pins: release tags that support game patch 2.5 (3.0.88.46235) where one
# exists; a branch where the project has no releases. The lock file holds the
# exact commit either way.
#
# `submodules = true` also checks out the submodules the superproject pins
# (the code a build of that repo would compile).
#
# Groups: core, plugins, bridges, examples, game, docs, heavy.
# `fetch_refs.py sync` takes every group except `heavy`; add `--with-heavy`.

# --- core: the frameworks nearly every mod stands on ------------------------

[[git]]
name = "cet"
url = "https://github.com/maximegmd/CyberEngineTweaks"
ref = "v1.38.1"
submodules = true
group = "core"
layer = "Lua runtime"
note = "Cyber Engine Tweaks: Lua over the game's scripting RTTI, Observe/Override hooks, console, TweakDB editor, ImGui overlay. 1.38.0 is the first 2.5 build."

[[git]]
name = "red4ext"
url = "https://github.com/wopss/RED4ext"
ref = "v1.31.0"
group = "core"
layer = "native loader"
note = "Native plugin loader (winmm.dll proxy). Everything below CET/redscript that ships a DLL needs it."

[[git]]
name = "red4ext-sdk"
url = "https://github.com/wopss/RED4ext.SDK"
ref = "master"
group = "core"
layer = "native SDK"
note = "Header-only SDK with generated RTTI type layouts (the REDengine counterpart of a Dumper-7 SDK). Last tagged release predates 2.5, so tracked on master."

[[git]]
name = "redscript"
url = "https://github.com/jac3km4/redscript"
ref = "v0.5.32"
group = "core"
layer = "script compiler"
note = "Compiler, decompiler and disassembler for the game's script language. 0.5.32 is the 2.5 release; the default branch 1.0.x is the next-generation compiler (prereleases only)."

[[git]]
name = "redscript-ide"
url = "https://github.com/jac3km4/redscript-ide"
ref = "v0.2.25"
group = "core"
layer = "script tooling"
note = "Language server for redscript: diagnostics and navigation without the game."

[[git]]
name = "redscript-dap"
url = "https://github.com/jac3km4/redscript-dap"
ref = "v0.0.8"
group = "core"
layer = "script tooling"
note = "Debug adapter: breakpoints and stepping in game scripts of a running game. Last release 2025-08, unverified against 2.5."

[[git]]
name = "tweakxl"
url = "https://github.com/psiberx/cp2077-tweak-xl"
ref = "v1.12.0"
submodules = true
group = "core"
layer = "data"
note = "Loads TweakDB edits (YAML/.tweak) from mods without overwriting each other."

[[git]]
name = "archivexl"
url = "https://github.com/psiberx/cp2077-archive-xl"
ref = "v1.28.1"
submodules = true
group = "core"
layer = "assets"
note = "Loads new items, appearances and world edits from .archive mods."

[[git]]
name = "codeware"
url = "https://github.com/psiberx/cp2077-codeware"
ref = "v1.21.1"
submodules = true
group = "core"
layer = "script library"
note = "Native library that widens what redscript and CET can reach (reflection, entities, UI, events)."

[[git]]
name = "red-hot-tools"
url = "https://github.com/psiberx/cp2077-red-hot-tools"
ref = "v1.3.0-rc.3"
submodules = true
group = "core"
layer = "dev loop"
note = "Hot reload of scripts, tweaks and archives; world/entity/UI inspector. RC3 shipped two days before patch 2.5, so 2.5 support is unconfirmed."

[[git]]
name = "red-cli"
url = "https://github.com/rayshader/cp2077-red-cli"
ref = "v0.5.1"
group = "core"
layer = "dev loop"
note = "Bundles and installs redscript/CET mods from a project folder (red.config.json)."

